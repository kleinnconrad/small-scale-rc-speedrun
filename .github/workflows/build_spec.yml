name: Build Specs and Docs

on:
  push:
    branches:
      - main
    paths:
      - '**/spec_*.yaml' # Reacts to every change of a specification
      - 'scripts/merge_specs.py'
  workflow_dispatch:

jobs:
  build-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pyyaml

      - name: Run Merge Script
        run: python scripts/merge_specs.py

      # Only the generated file is committed, never other files of the workspace
      - name: Commit and Push full_spec.yaml
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain specs/full_spec.yaml)" ]]; then
            git add specs/full_spec.yaml
            git commit -m "chore(docs): auto-update specs and docs [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes to specs/full_spec.yaml detected."
          fi
