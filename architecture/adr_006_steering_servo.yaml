adr:
  id: ADR-006
  title: Selection of the steering servo for precise high-speed control
  status: decided
  date: '2026-08-21'
  context: "At speeds of 100 km/h, enormous aerodynamic and mechanical forces act on the front wheels of the Carten T410R. A minimal jitter, play or a too slow reaction time of the steering servo can immediately lead to loss of control and total failure. In addition, space in a 1:10 touring car chassis is limited. The servo must hold the straight line precisely, return reproducibly to the neutral position and execute the counter-steering commands of the steering gyro (ADR-011) without delay. A low-profile servo with metal gears (robustness), high speed and a precise neutral return is required.\n"
  considered_alternatives:
  - option_id: 1
    name: Standard RTR / Plastic Gear Servo (3-6 kg)
    type: Low-End / Standard Size
    evaluation: Very cheap (often < 15 €), but life-threatening for the project.
      Plastic gears shear off immediately under the restoring forces at 100 km/h. With
      often > 0.15s positioning time much too slow.
  - option_id: 2
    name: High-End Brushless Full-Size Servo (e.g. Savöx SB-2290SG)
    type: Premium / Standard Size / 50+ kg
    evaluation: 'Monstrous torque and very fast. But: Completely oversized
      (Over-Engineering), very expensive (> 130 €) and above all too large as a full-size servo
      for the compact chassis.'
  - option_id: 3
    name: Savöx SC-1251MG+
    type: Mid-Range / Low-Profile / Metal Gear
    evaluation: Proven low-profile servo of the same series and price class (approx. 55-65 €)
      with high quality and a speed of 0.09s. Slower than the SC-1252MG+ (0.07s).
  - option_id: 4
    name: JX PDI-4409MG
    type: Budget / Low-Profile / Metal Gear
    evaluation: Good price-performance ratio (~15-22 €) with a robust metal gear, a torque
      of 9.2 kg and a reaction time of 0.11s in a space-saving low-profile design. Selected
      for the MVP. Test drives showed that it did not reproducibly return to the neutral
      position, so the steering precision was insufficient for speedruns.
  - option_id: 5
    name: Savöx SC-1252MG+
    type: Mid-Range / Low-Profile / Metal Gear / Coreless
    evaluation: Digital low-profile servo with coreless motor and metal gears. Speed of
      0.07s, torque of 7 kg and a precise, reproducible return to the neutral position
      (52.72 €).
  decision: Savöx SC-1252MG+
  servo_meta:
    brand: Savöx
    model: SC-1252MG+
    type: Digital Low-Profile Servo
  rationale: "Test drives with the MVP servo (JX PDI-4409MG) showed that the required steering precision was not reached, as the servo did not reproducibly return to the neutral position. The change to the Savöx SC-1252MG+ (52.72 €) was necessary to reach an appropriate steering precision. It offers a speed of 0.07s, a torque of 7 kg and a precise return to the neutral position. In addition, the mechanical resistance in the steering caused by overtightened C-hub mounting screws was eliminated (error log no. 14). Since test drive 13, corrective steering maneuvers can be executed effectively.\n"
  consequences:
  - 'Servo horn: To minimize play in the steering system, a rigid aluminum lever (ALU CLAMP SERVO HORN - FUTABA, SAVÖX - 3-HOLE - 25T, item HUD293409) is mounted without a servo saver.'
  - 'BEC voltage: The BEC output voltage of the controller is configured to 6.0V.'
  - 'Dual-Rate: The maximum steering angle is limited on the remote control to ensure stability at 100 km/h.'
