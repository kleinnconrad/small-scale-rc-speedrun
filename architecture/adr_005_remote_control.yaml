adr:
  id: ADR-005
  title: Selection of the remote control system for 100 km/h speedruns
  status: decided
  date: '2026-08-20'
  context: "An RC car traveling at 100 km/h (approx. 27.7 meters per second) covers \nenormous distances in a few seconds. \nThe remote control (transmitter) \nand the receiver \nmust therefore absolutely have a stable radio connection \nand an absolutely reliable fail-safe \nso that the vehicle does not get out of control at the end \nof the acceleration stretch. \nA balance must be struck \nbetween maximum range incl. gyro support and a \nrobust, \nfailsafe MVP approach (Minimum Viable Product) that reduces the complexity in \nthe setup.\n"
  considered_alternatives:
  - option_id: 1
    name: Standard RTR / Budget Transmitter (e.g. FlySky FS-GT2)
    type: Low-End / Basic 2.4 GHz
    evaluation: Very cheap, but the range is often limited to 100-150 meters.
      A massive security risk for speedruns. Also offers no gyro support
      in the standard receiver.
  - option_id: 2
    name: High-End Competition Transmitter (e.g. Sanwa MT-44 / Futaba 4PM)
    type: Premium / Ultra-Low Latency
    evaluation: Offers very low latency and detailed setup options
      on a display. Optimal for winding racetracks, but completely oversized for pure
      straight-line driving (speedrun). Priced often well over
      250 €.
  - option_id: 3
    name: DumboRC X6
    type: Mid-Range Budget Secret Tip
    evaluation: Forgoes a display and telemetry, but offers a gigantic range for this
      price class (~35 €) of often over 400 meters. The matching
      receivers (X6FG) have an integrated, adjustable gyro for perfect
      straight-line stability.
  - option_id: 4
    name: Carson Reflex Wheel X1
    type: Solid MVP Approach (2-Channel 2.4 GHz)
    evaluation: Very reliable and proven entry-level system. Although it offers no
      gyro and slightly less maximum range than the DumboRC, it scores with
      absolute simplicity, a highly robust fail-safe and absolutely necessary
      setting options (Dual Rate) for initial 100 km/h tests.
  - option_id: 5
    name: Konect X9S Radio + RG4CHWP Receiver
    type: Mid-Range / 4-Channel 2.4 GHz Pistol Grip Transmitter
    evaluation: Hall sensor transmitter and a waterproof 4-channel receiver with fail-safe.
      The additional channels allow a remote gyro gain adjustment (ADR-011). Higher price
      (~152 €) than the MVP options.
  decision: Konect X9S Radio + Mini Waterproof 4-Channel Receiver RG4CHWP
  tx_meta_transmitter:
    brand: Konect
    model: X9S Radio
    type: 4-Channel 2.4 GHz Pistol Grip Transmitter
  rationale: "The tests with the Carson Reflex Wheel X1 showed insufficient steering precision, as the servo did not reproducibly return to the neutral position depending on the steering angle. To increase steering precision, the Konect X9S remote control was purchased in combination with the RG4CHWP receiver for 152 €.\n"
  consequences:
  - 'Receiver installation: The RG4CHWP receiver is installed and the fail-safe must absolutely be programmed to brake/neutral.'
  - 'Interface compatibility: The operating voltage of the receiver must be matched with the BEC output voltage of the motor controller.'
  - 'Steering angle limitation: The steering deflections (Dual Rate) are adapted to the requirements of high-speed driving.'
