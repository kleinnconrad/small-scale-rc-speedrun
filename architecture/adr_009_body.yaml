adr:
  id: ADR-009
  title: Selection of the aerodynamic body for 100 km/h speedruns
  status: decided
  date: '2026-03-12'
  context: "At a target speed of 100 km/h (approx. 27.7 m/s), the body is \nno longer a purely visual component, but the primary aerodynamic protective layer. \nA classic, boxy body \ntraps air under the front apron, \nwhich inevitably leads to a 'blow-over' (lifting off due to \ndynamic pressure). At the same time, \nthe air resistance (drag coefficient) must not unnecessarily slow down the motor. \nThe Carten T410R chassis requires a width of 190 mm. The material thickness is \ncritical: \nThin lexan (< 0.5 mm) deforms massively at 100 km/h.\n"
  considered_alternatives:
  - option_id: 1
    name: Standard Touring Car / Bash Body (e.g. Nissan Skyline, BMW M3)
    type: Scale Looks / High Drag
    evaluation: Visually appealing, but aerodynamically a parachute. High risk
      for blow-overs. Architecturally unsuitable for 100 km/h.
  - option_id: 2
    name: ZooRacing Wolverine (190 mm)
    type: CFD-optimized Competition Body
    evaluation: Offers highly efficient airflow management and a lot of downforce on
      the front axle. Designed more for tight corners (steering).
  - option_id: 3
    name: Le Mans Prototype / Group C (e.g. Mon-Tech M-10)
    type: Wedge Shape / Low Drag
    evaluation: 'The absolute secret weapon for pure speedruns. Offers the lowest possible
      frontal area. Disadvantage: Very flat front design often causes conflicts with
      the front shock towers of the Carten T410R.'
  - option_id: 4
    name: ZooRacing Hellcat (190 mm, 0.7mm Regular)
    type: CFD-optimized High-Speed Touring Car Body
    evaluation: Offers an even flatter roofline and windshield than the Wolverine.
      Excellent airflow to the rear wing, very low air resistance for high
      top speed combined with outstanding straight-line stability.
  decision: ZooRacing Hellcat (190 mm, 0.7mm thickness)
  body_meta:
    brand: ZooRacing
    model: Hellcat
    required_width: 190 mm
    required_thickness: 0.7 mm (Regular Weight)
  rationale: "The decision is made in favor of the ZooRacing Hellcat in the 0.7mm standard thickness. \nIt represents the \noptimal compromise between minimum air resistance (for \nreaching 100 km/h) and safe \ndownforce (prevention of blow-overs). Unlike very flat LMP bodies, \nit fits easily over \nthe shock towers of the Carten T410R. The material thickness of 0.7mm \nguarantees \nthat the body withstands the massive dynamic pressure at top speed and does not \nstart to vibrate or rub against the tires.\n"
  consequences:
  - 'Assembly: The included rear wing must be screwed on very rigidly. The
    body holes must be precisely machined with lexan scissors and a body reamer.'
  - 'Chassis preparation: The foam bumper on the front of the Carten T410R must
    sit exactly flush with the inside of the front apron to prevent it from being pushed in
    at high speed.'
