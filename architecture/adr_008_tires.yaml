adr:
  id: ADR-008
  title: Selection of tires (belted rubber tires for asphalt) for 100 km/h speedruns
  status: Decided
  date: '2026-02-25'
  context: "At a target speed of 100 km/h and the associated high \nspeeds \nof the wheels, standard rubber tires expand massively in the middle due to centrifugal force \n(the so-called \"pizza cutter effect\" or \"ballooning\"\n). This leads to an immediate \nloss of control and often to the tire bursting. \nPre-glued tires \non rims with a 12mm hex hub \n(suitable for the Carten T410R chassis) are required, \nwhich retain their shape 100% under high centrifugal forces \nand whose rubber compound \nwithstands the high friction heat on rough \nasphalt. \nIn addition, the real track conditions (not \ndust-free normal asphalt vs. \ncleanly prepared race track) must be considered when choosing \nthe tire tread (slick vs. grooved). \n\n"
  considered_alternatives:
  - option_id: 1
    name: Standard Touring Car Rubber Tires (Non-Belted)
    type: Low-Budget / RTR Standard
    evaluation: Life-threatening for this project. The lack of fabric inside
      leads to immediate ballooning at the targeted 44,000 rpm of the motor,
      loss of traction and, in the worst case, tire blowouts.
  - option_id: 2
    name: Contact RC 1/10 Foam Tires
    type: High-Grip / Lightweight
    evaluation: The classic speedrun tire. Does not expand at all for physical reasons
      and offers gigantic grip. However, it is highly susceptible to road dirt
      (small stones immediately tear pieces out of the foam).
  - option_id: 3
    name: Sweep HANKOOK Tread Belted 32deg (for Carpet)
    type: Indoor / Carpet
    evaluation: Have the saving belted fabric, but the 32-shore
      rubber compound is much too soft for asphalt. At 100 km/h on the street,
      these tires would massively overheat and wear out very quickly or disintegrate.
  - option_id: 4
    name: Full-Slicks Belted (e.g. Sweep EXP Belted Slicks / Matrix Slicks)
    type: Premium / Treadless
    evaluation: Physically offer the maximum contact to the road (100% rubber contact)
      and extreme smoothness, as no tread blocks can flex. Are the absolute fastest tires at 100 km/h,
      BUT absolutely require an optimally swept,
      clean track. They slide massively on dusty roads.
  - option_id: 5
    name: Sweep HANKOOK Tread Belted tires Pre-glued set Pro-compound 36deg (for Asphalt)
    type: High-Performance / Tread-Asphalt
    evaluation: The perfect compromise solution for normal roads. The molded-in
      fabric belt completely prevents ballooning. The harder 36-shore compound
      is approved for asphalt. The tread forgives light road dust much
      better than a pure slick.
  - option_id: 6
    name: Team Corally C-14705-35 Attack Moosgummi Reifen
    type: Foam rubber tire / High-Grip
    evaluation: Foam tires do not expand due to centrifugal forces. They provide significantly improved stability and grip for speedruns compared to belted tires, which makes a big difference at high speeds.
  decision: Team Corally C-14705-35 Attack Moosgummi Reifen - 1/10 GP Toerenwagen - 35 shore
  tires_meta:
    brand: Team Corally
    model: Attack Moosgummi Reifen (C-14705-35)
    type: Foam rubber tires
    hex_size: 12mm
    width: "30mm (rear), 26mm (front)"
    surface: Asphalt
  rationale: "While belted tires avoid ballooning, they do not provide sufficient stability and grip for speedruns. Changing to foam rubber tires significantly improves both stability and grip at high speeds. Thus, the decision was revised to use the Team Corally 35 shore foam tires."
  consequences:
  - 'Pre-check: Even factory pre-glued tires must absolutely be checked
    for manufacturing defects on the glue seam before the first run (pull briefly on the tire sidewall).'
  - 'Balancing: Since the smallest imbalances destabilize the chassis at 100 km/h,
    the wheels should ideally be balanced with an RC tire balancer and putty lead.'
  - 'Temperature window: The 36-shore compound is relatively hard. In order to build up maximum mechanical
    grip, the tires must be warmed up by 1-2 slow laps before the actual speedrun.'
