spec:
  meta:
    type: CARTEN NBA360 Steel Spur Gear (48 DP, 68T)
    mechanical_load_capacity: '> 100 km/h (designed for 3S / 120A Brushless Systems)'
  properties:
    material_and_construction:
      gear_body: Steel - CNC machined
      mounting_interface: Standard 1:10 Touring car 4-hole mount
      mating_pinion: Hardened steel (mandatory)
    mandatory_modifications:
      pinion_securing:
        issue: Slipping of the motor pinion (cause of gearbox damage)
        description: In order to prevent the main gear from slipping and being destroyed again by
          asymmetrical engagement, the grub screw of the hard steel pinion
          must absolutely be secured with medium-strength threadlocker (e.g. Loctite 243 / blue)
          on the flat spot of the motor shaft.
      gear_mesh_calibration:
        issue: Gear backlash at approx. 26,000 RPM (spur gear) and 41,000 RPM (pinion)
        description: The play between the steel pinion and the steel spur gear must be
          calibrated exactly with the proven paper method. Too tight play
          leads to extreme friction heat, power loss and high wear.
      material_selection:
        issue: Switch to steel spur gear
        description: Due to previous damage to plastic gears, a
          more robust steel spur gear was chosen. This increases the rotating mass,
          but secures the mechanical integrity of the drivetrain at high torques.
