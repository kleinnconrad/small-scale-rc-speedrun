spec:
  meta:
    brand: Konect
    model: X9S Radio + RG4CHWP Receiver
    type: 4-Channel 2.4 GHz Pistol Grip Transmitter
    channels: 4
    price_class: Mid-Range (~152 EUR)
    shopping_item:
      add_to_list: true
      item_name: Konect X9S Radio + Mini Waterproof 4-Channel Receiver RG4CHWP
      category: Control & Electronics
      reference_link: Search at RC model specialist dealer (e.g. Tamico, Berlinski, Amazon)
      estimated_price_eur: 152.0
    integrated_features:
    - Fail-Safe Function (Protection in case of signal loss)
    input_voltage: 'Coordination with BEC of the ESC required'
  properties:
    tx_performance:
      protocol: 2.4Ghz
      range_ground: '>200m'
      response_time: Low latency for high precision
      power_supply: Transmitter batteries according to manufacturer specifications
      potentiometer: Hall Sensor for highest possible precision
    calibration_and_setup:
      fail_safe_activation: The fail-safe must absolutely be programmed to brake! Jack up the car, hold full brake on the remote and press the setup button on the receiver. When turning off the remote, the car must brake immediately.
      steering_dual_rate: Reduce the maximum steering angle via the Dual Rate (D/R) dial on the remote control. At 100 km/h, full steering angle leads to a rollover.
      throttle_trim: The throttle trim (TH Trim) must be exactly at the zero point (center) before the ESC is calibrated.
      bec_voltage_warning: The BEC of the ESC must be matched with the input voltage of the receiver.
